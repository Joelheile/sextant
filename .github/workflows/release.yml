name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - name: Check the tag matches the app version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version app/tauri.conf.json)"
      - run: bun install --frozen-lockfile
      - run: scripts/fetch-onnxruntime.sh
      # Tauri imports APPLE_CERTIFICATE into a temporary keychain, signs the library, the binary and
      # the app with the hardened runtime, notarizes the app and staples the ticket.
      - name: Build, sign and notarize
        run: bun tauri build --target aarch64-apple-darwin
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify the signed app
        run: |
          app=target/aarch64-apple-darwin/release/bundle/macos/Sextant.app
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
      - name: Name the files and write the checksum
        run: |
          mkdir release
          cp target/aarch64-apple-darwin/release/bundle/dmg/Sextant_*_aarch64.dmg release/Sextant.dmg
          cp scripts/install.sh release/install.sh
          cd release
          shasum -a 256 Sextant.dmg > Sextant.dmg.sha256
          cat Sextant.dmg.sha256
      - name: Publish the release
        run: |
          gh release create "$GITHUB_REF_NAME" release/Sextant.dmg release/Sextant.dmg.sha256 release/install.sh \
            --title "Sextant ${GITHUB_REF_NAME#v}" \
            --notes "SHA-256 of Sextant.dmg: $(cut -d ' ' -f 1 release/Sextant.dmg.sha256)"
        env:
          GH_TOKEN: ${{ github.token }}
