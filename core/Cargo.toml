[package]
name = "sextant-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "sextant_core"

[lints]
workspace = true

[dependencies]
petgraph = { version = "0.8.3", default-features = false, features = ["std"] }
regex = "1.13.1"
rusqlite = { version = "0.41.0", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
insta = "1.49.0"
