[package]
name = "sextant-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sextant"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
libc = "=0.2.191"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sextant-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
getrandom = "=0.3.4"
keyring = "=4.2.0"
objc2 = "=0.6.5"
objc2-event-kit = "=0.3.2"
objc2-foundation = { version = "=0.3.2", features = ["NSArray", "NSCalendar", "NSDate", "NSError", "NSString"] }

[lints]
workspace = true
