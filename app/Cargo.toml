[package]
name = "sextant-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sextant"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
crossbeam-queue = "=0.3.14"
libc = "=0.2.191"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sextant-core = { path = "../core" }
sha2 = "=0.10.9"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
cpal = "=0.18.2"
dispatch2 = "=0.3.1"
getrandom = "=0.3.4"
keyring = "=4.2.0"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "libc", "block2", "objc2-core-foundation", "objc2-core-graphics", "NSPasteboard", "NSRunningApplication", "NSWorkspace", "NSGraphicsContext", "NSFont", "NSFontDescriptor", "NSColor", "NSAttributedString", "NSStringDrawing", "NSControl", "NSCursor", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSGraphics", "NSImage", "NSImageView", "NSPanel", "NSResponder", "NSText", "NSTextField", "NSView", "NSWindow"] }
objc2-application-services = { version = "=0.3.2", default-features = false, features = ["std", "libc", "AXError", "AXUIElement", "AXValue", "HIServices"] }
objc2-core-audio = { version = "=0.3.2", default-features = false, features = ["std", "AudioHardware", "block2", "dispatch2", "libc", "objc2", "objc2-core-audio-types", "objc2-foundation"] }
objc2-core-audio-types = { version = "=0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFArray", "CFBase", "CFCGTypes", "CFData", "CFDate", "CFDictionary", "CFNumber", "CFRunLoop", "CFString"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "block2", "CGBitmapContext", "CGColorSpace", "CGContext", "CGDirectDisplay", "CGEventSource", "CGEventTypes", "CGImage", "CGSession", "CGDataProvider", "CGGeometry", "CGWindow"] }
objc2-event-kit = "=0.3.2"
objc2-foundation = { version = "=0.3.2", features = ["NSArray", "NSCalendar", "NSDate", "NSDictionary", "NSError", "NSString", "NSValue", "NSGeometry", "NSData", "NSUUID", "NSURL", "NSURLSession", "NSURLRequest", "NSURLResponse", "NSOperation", "block2"] }
objc2-screen-capture-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "libc", "objc2-core-foundation", "objc2-core-graphics", "SCScreenshotManager", "SCShareableContent", "SCStream"] }
objc2-vision = { version = "=0.3.2", default-features = false, features = ["std", "objc2-core-graphics", "objc2-core-foundation", "VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNTypes", "VNGeometry"] }
parakeet-rs = { version = "=0.4.3", default-features = false, features = ["cpu", "coreml", "load-dynamic", "api-28"] }

[lints]
workspace = true
